<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星星小宇宙">
<meta name="theme-color" content="#070720">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>星星小宇宙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --bg0:#070720; --bg1:#140f3d; --bg2:#2c1a5e;
  --card:rgba(255,255,255,.065); --line:rgba(255,255,255,.13);
  --text:#f4effe; --muted:#b9afdb; --gold:#ffd98a; --pink:#ff9ecf; --cyan:#8fe3ff; --violet:#b48cff;
  --ok:#7be0a8; --ng:#ff8aa6;
  --font:"LXGW WenKai TC","PingFang TC","Heiti TC",-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg0);color:var(--text);font-family:var(--font);overscroll-behavior:none}
body{background:radial-gradient(ellipse 120% 70% at 50% 110%,#3d2275 0%,#1d1450 40%,#0b0a2a 75%,#070720 100%) fixed;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
textarea,input{font:inherit;-webkit-user-select:text;user-select:text}
h2,h3,h4,p{margin:0}
.hidden{display:none!important}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.gold{color:var(--gold)}
.big{font-size:22px;font-weight:700;margin:4px 0}

#sky,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0}
#fx{z-index:90}

#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 10px) 18px 12px;
  background:linear-gradient(to bottom,rgba(7,7,32,.92) 30%,rgba(7,7,32,0))}
.brand{font-size:17px;font-weight:700;letter-spacing:1.5px;color:var(--text)}
.brand span{color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;background:rgba(255,217,138,.1);
  border:1px solid rgba(255,217,138,.35);color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.pill.bump{animation:bump .55s ease}
@keyframes bump{30%{transform:scale(1.22)}60%{transform:scale(.94)}}

.page{display:none;padding:6px 16px calc(100px + env(safe-area-inset-bottom))}
.page.active{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.ptitle{font-size:24px;text-align:center;margin:6px 0 6px;letter-spacing:2px}
.ptitle+p{margin-bottom:16px;line-height:1.6}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h4{font-size:16px;margin-bottom:12px;letter-spacing:1px;color:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 26px;border-radius:999px;
  background:linear-gradient(135deg,#a47bff,#ff92c9);color:#fff;font-weight:700;font-size:16px;letter-spacing:1px;
  box-shadow:0 6px 20px rgba(180,120,255,.35);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:linear-gradient(135deg,#ff6b8a,#ff9e7a)}
.btn.sm{padding:9px 16px;font-size:14px}

/* ---------- 首頁 ---------- */
.hero{display:flex;align-items:center;gap:14px;margin:8px 4px 18px}
.moon{font-size:46px;line-height:1;filter:drop-shadow(0 0 14px rgba(255,217,138,.6))}
.moon.wiggle{animation:wiggle .4s}
@keyframes wiggle{25%{transform:rotate(-14deg)}75%{transform:rotate(12deg)}}
.m-icon.thief{animation:thiefShake .7s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,138,166,.6))}
@keyframes thiefShake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-6px) rotate(-8deg)}40%{transform:translateX(5px) rotate(6deg)}60%{transform:translateX(-4px) rotate(-4deg)}80%{transform:translateX(4px) rotate(4deg)}}
.sheet .opt{font-size:16px;padding:12px 14px;margin:8px 0;text-align:center}
/* 連續簽到 */
.streak{display:flex;justify-content:space-between;gap:4px;margin:4px 0 10px}
.s-dot{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 6px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.2}
.s-dot b{font-size:14px}
.s-dot.on{background:linear-gradient(160deg,rgba(255,217,138,.28),rgba(255,158,207,.18));border-color:rgba(255,217,138,.5);color:var(--gold)}
.s-dot.now{box-shadow:0 0 14px rgba(255,217,138,.45);transform:scale(1.06)}
/* 成就星圖 */
.entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.entry .e-ic{font-size:30px}
.entry .e-txt{flex:1}
.entry .e-txt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.entry .e-arrow{color:var(--muted);font-size:22px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;padding:6px 0}
.cmap{margin:6px auto 12px;max-width:330px}
.cmap svg{width:100%;height:auto;display:block;overflow:visible}
.cline{stroke:rgba(255,255,255,.2);stroke-width:.6;stroke-dasharray:1.6 1.2}
.cline.on{stroke:rgba(255,217,138,.65);stroke-dasharray:none;stroke-width:.8}
.cdeco{fill:rgba(255,255,255,.35)}
.cstar{cursor:pointer}
.cstar .glow{fill:rgba(255,217,138,.28);animation:twinkle 2.6s ease-in-out infinite}
.cstar.on .core{fill:rgba(255,217,138,.2);stroke:rgba(255,217,138,.85);stroke-width:.5}
.cstar.off .core{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.3);stroke-width:.4}
.cstar.off text{fill:rgba(255,255,255,.45)}
@keyframes twinkle{50%{opacity:.45}}
.blist{list-style:none;margin:0;padding:0}
.blist li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}
.blist li:first-child{border-top:0;padding-top:0}
.b-ic{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.blist li.on .b-ic{background:linear-gradient(160deg,rgba(255,217,138,.35),rgba(255,158,207,.2));border-color:rgba(255,217,138,.6);box-shadow:0 0 14px rgba(255,217,138,.35)}
.blist li.off .b-ic{filter:grayscale(1);opacity:.55}
.b-txt{flex:1;min-width:0}
.b-name{font-weight:700}
.b-desc{font-size:13px;color:var(--muted)}
.b-bar{height:5px;border-radius:5px;background:rgba(255,255,255,.1);margin-top:7px;overflow:hidden}
.b-bar div{height:100%;background:linear-gradient(90deg,#ffd98a,#ff9ecf)}
.b-pct{font-size:12px;color:var(--muted);white-space:nowrap}
.badge-pop{display:inline-block;animation:bump .8s ease}
.m-icon img.thief-img{width:170px;max-width:60vw;height:auto;display:block;margin:0 auto 4px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.m-icon.away{animation:thiefAway .65s ease-in forwards}
@keyframes thiefAway{to{transform:translateX(220px) rotate(25deg);opacity:0}}
.m-icon.win{animation:thiefWin .45s ease-out 2}
@keyframes thiefWin{50%{transform:translateY(-12px) scale(1.08)}}
.hello{font-size:24px;font-weight:700}
.sub{color:var(--muted);margin-top:4px;font-size:14px}
.bday{text-align:center;background:linear-gradient(135deg,rgba(255,158,207,.14),rgba(180,140,255,.14))}
.bday .num{font-size:44px;color:var(--gold)}
.bday.today{border-color:rgba(255,217,138,.6);box-shadow:0 0 30px rgba(255,217,138,.25)}
.points-card{text-align:center}
.points-big{font-size:40px;font-weight:700;color:var(--gold);margin:4px 0 6px;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,217,138,.45)}
.task{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-top:1px solid rgba(255,255,255,.07)}
.task:first-of-type{border-top:0}
.t-ic{font-size:26px;width:36px;text-align:center}
.t-txt{flex:1;font-size:16px}
.t-txt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.t-st{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:linear-gradient(135deg,#a47bff,#ff92c9)}
.t-st.done{background:rgba(123,224,168,.18);color:var(--ok)}
.letter p{line-height:1.8;font-size:16px}
.letter .sign{text-align:right;color:var(--muted);margin-top:10px}
/* 樹洞回信 */
.pick-list{max-height:46vh;overflow:auto;text-align:left;-webkit-overflow-scrolling:touch}
.pick{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:8px;line-height:1.5}
.pick:active{background:rgba(255,255,255,.12)}
.pick small{display:block;color:var(--muted);font-size:12px}
.pick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pick-grid .pick{text-align:center;padding:10px 2px 8px;font-size:26px;line-height:1.2;margin:0}
.pick-grid .pick small{font-size:11px;margin-top:2px}
.pick-grid .pick.dim{opacity:.45}
.courier{font-size:58px;display:inline-block;animation:courierHop .9s ease-in-out infinite;transform-origin:50% 100%}
@keyframes courierHop{50%{transform:translateY(-8px) rotate(-6deg)}}
.quote{background:rgba(255,255,255,.06);border-left:3px solid var(--violet);border-radius:10px;padding:10px 12px;text-align:left;font-size:14px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:110px;overflow:auto}
.letter-text{text-align:left;line-height:1.8;white-space:pre-wrap;word-break:break-word;margin-top:10px;max-height:240px;overflow:auto;-webkit-user-select:text;user-select:text}
.reply{margin-top:8px;background:rgba(143,214,148,.1);border:1px solid rgba(143,214,148,.35);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.reply b{display:block;font-size:12px;color:var(--ok);margin-bottom:2px}
.reply .r-gift{margin-top:4px;color:var(--gold);font-size:13px}
.gift-card{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:14px;text-align:left;
  background:linear-gradient(135deg,rgba(255,217,138,.16),rgba(255,158,207,.12));border:1px solid rgba(255,217,138,.45)}
.gift-card .g-ic{font-size:36px;line-height:1;filter:drop-shadow(0 0 10px rgba(255,217,138,.5));animation:giftWiggle 1.6s ease-in-out infinite}
.gift-card .g-name{font-weight:700;color:var(--gold);line-height:1.4}
/* 星圖全亮 */
.cmap.alive .cstar.on .core{animation:starPulse 2.2s ease-in-out infinite}
.cmap.alive .cstar.on .glow{animation:twinkle 1.6s ease-in-out infinite}
.cmap.alive .cline.on{stroke-dasharray:3 2.5;animation:lineFlow 1.4s linear infinite}
.cmap.alive svg{animation:skySway 7s ease-in-out infinite}
@keyframes starPulse{50%{transform:scale(1.25)}}
@keyframes lineFlow{to{stroke-dashoffset:-11}}
@keyframes skySway{50%{transform:rotate(2deg) scale(1.02)}}
.cmap.alive .cstar .core{transform-box:fill-box;transform-origin:center}
.cmap.mini{max-width:220px;margin:0 auto 6px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.hist li:first-child{border-top:0}
.hist .h-ic{width:24px;text-align:center}
.hist .h-txt{flex:1}
.hist .h-txt small{display:block;color:var(--muted);font-size:12px}
.hist .plus{color:var(--gold);font-weight:700}
.hist .minus{color:var(--pink);font-weight:700}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:6px 0}
.a2hs{display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.5;border-color:rgba(143,227,255,.35)}
.a2hs button{color:var(--muted);font-size:18px;padding:4px}

/* ---------- 輪盤 ---------- */
.wheel-wrap{position:relative;width:min(84vw,340px);aspect-ratio:1;margin:22px auto 26px}
.wheel-wrap::before{content:"";position:absolute;inset:-14px;border-radius:50%;
  background:conic-gradient(from 0deg,#b48cff,#ff9ecf,#ffd98a,#8fe3ff,#b48cff);filter:blur(18px);opacity:.45;animation:spinslow 12s linear infinite}
@keyframes spinslow{to{transform:rotate(360deg)}}
#wheel{position:relative;width:100%;height:100%;border-radius:50%;display:block;
  box-shadow:0 0 0 5px rgba(255,217,138,.75),0 0 0 9px rgba(20,15,61,.9),0 0 40px rgba(180,140,255,.5)}
.pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);z-index:3;width:34px;height:42px;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.spin-btn{position:absolute;inset:0;margin:auto;width:27%;height:27%;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 35% 30%,#fff6d6,#ffd273 45%,#d9902f);color:#3a2207;font-size:22px;font-weight:700;
  box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 -4px 8px rgba(0,0,0,.18),0 0 0 4px rgba(255,255,255,.15)}
.spin-btn:active{transform:scale(.93)}
.spin-btn:disabled{filter:saturate(.4) brightness(.85)}

/* ---------- 遊戲列表 ---------- */
.game-card{display:flex;align-items:center;gap:14px}
.g-emoji{font-size:38px;width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:rgba(255,255,255,.07)}
.g-info{flex:1;min-width:0}
.g-name{font-size:18px;font-weight:700;margin-bottom:3px}
.g-info .small{line-height:1.5}

/* ---------- 遊戲畫面 ---------- */
.game{position:fixed;inset:0;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse 120% 70% at 50% 110%,rgba(61,34,117,.97),rgba(11,10,42,.97) 70%);
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.game-inner{max-width:480px;margin:0 auto}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:16px}
.game-title{font-size:19px;font-weight:700;flex:1;text-align:center}
.game-stat{min-width:40px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;font-size:15px;white-space:nowrap}
.game-hint{text-align:center;color:var(--muted);line-height:1.7;margin:4px 0 6px;font-size:14px}

/* 撈星星 */
.catch-wrap{margin:10px 0 16px}
canvas.catch{width:100%;display:block;border-radius:20px;border:1px solid var(--line);touch-action:none;
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(180,140,255,.14))}
.whack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 6px 26px}
.hole{position:relative;aspect-ratio:1}
.pit{position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 62%,#060518 0 40%,rgba(130,100,220,.45) 41% 52%,rgba(130,100,220,.08) 53%);
  box-shadow:inset 0 6px 14px rgba(0,0,0,.6)}
.mole{position:absolute;left:0;right:0;bottom:-80%;text-align:center;font-size:clamp(34px,11vw,48px);line-height:1;transition:bottom .16s ease-out}
.hole.up .mole{bottom:24%}
.hole.hit .mole{transform:scale(1.5);opacity:0;transition:transform .2s,opacity .2s,bottom .16s}
.hole.shake .pit{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.floatxt{position:absolute;left:50%;top:10%;transform:translateX(-50%);font-weight:700;font-size:22px;pointer-events:none;animation:floatUp .7s ease-out forwards;z-index:2}
.floatxt.good{color:var(--gold)} .floatxt.bad{color:var(--ng)}
@keyframes floatUp{to{transform:translate(-50%,-40px);opacity:0}}
/* 命運骰子 */
.dice{width:88px;height:88px;margin:0 auto 10px;border-radius:20px;background:linear-gradient(145deg,#ffffff,#e4ddff);box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 -5px 0 rgba(0,0,0,.08);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13px;gap:5px}
.dice.roll{animation:diceRoll .45s linear infinite}
@keyframes diceRoll{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(14deg) translateY(-10px)}50%{transform:rotate(0) translateY(0)}75%{transform:rotate(-14deg) translateY(-10px)}100%{transform:rotate(0)}}
.dice.land{animation:pop .5s}
.dice i{border-radius:50%;background:#2c1a5e;opacity:0}
.dice[data-f="1"] i:nth-child(5),
.dice[data-f="2"] i:nth-child(3),.dice[data-f="2"] i:nth-child(7),
.dice[data-f="3"] i:nth-child(3),.dice[data-f="3"] i:nth-child(5),.dice[data-f="3"] i:nth-child(7),
.dice[data-f="4"] i:nth-child(1),.dice[data-f="4"] i:nth-child(3),.dice[data-f="4"] i:nth-child(7),.dice[data-f="4"] i:nth-child(9),
.dice[data-f="5"] i:nth-child(1),.dice[data-f="5"] i:nth-child(3),.dice[data-f="5"] i:nth-child(5),.dice[data-f="5"] i:nth-child(7),.dice[data-f="5"] i:nth-child(9),
.dice[data-f="6"] i:nth-child(1),.dice[data-f="6"] i:nth-child(3),.dice[data-f="6"] i:nth-child(4),.dice[data-f="6"] i:nth-child(6),.dice[data-f="6"] i:nth-child(7),.dice[data-f="6"] i:nth-child(9){opacity:1}
/* 刮刮樂 */
.scratch{position:relative;width:270px;max-width:100%;height:156px;margin:0 auto 10px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#2c1a5e,#4a2a8c);border:2px solid rgba(255,217,138,.65);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.s-prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.s-prize .s-big{font-size:40px;line-height:1}
.s-prize .s-txt{font-size:20px;font-weight:700;color:var(--gold)}
.s-cover{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.s-cover.done{transition:opacity .6s;opacity:0;pointer-events:none}
.countdown{font-size:72px;font-weight:700;text-align:center;color:var(--gold);text-shadow:0 0 24px rgba(255,217,138,.6);animation:pop .5s}

/* 翻牌 */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.mcard{aspect-ratio:3/4;perspective:700px}
.mcard .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:13px;display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{background:linear-gradient(140deg,#3a2a85,#6b3fa0);border:1px solid rgba(255,217,138,.4);color:var(--gold);font-size:22px;
  box-shadow:inset 0 0 14px rgba(255,255,255,.08)}
.face.front{background:linear-gradient(160deg,#fbf7ff,#e9defd);transform:rotateY(180deg);font-size:clamp(26px,9vw,36px)}
.mcard.matched .face.front{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(255,217,138,.75)}
.mcard.matched{animation:pop .4s}

/* 問答 */
.qbar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:14px}
.qbar div{height:100%;background:linear-gradient(90deg,#a47bff,#ff92c9);transition:width .3s}

.opt.right{background:rgba(123,224,168,.18);border-color:var(--ok)}

.qnote .ok{color:var(--ok)} .qnote .ng{color:var(--ng)}

/* ---------- 兌換 ---------- */
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.prize{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:16px 10px 14px;border-radius:20px;

.coupon{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;border-radius:16px;position:relative;
  background:linear-gradient(135deg,rgba(255,217,138,.13),rgba(255,158,207,.1));border:1px dashed rgba(255,217,138,.5)}

.sea .moonref{position:absolute;left:62%;top:53%;width:46px;height:70px;background:radial-gradient(ellipse at 50% 0,rgba(255,217,138,.45),transparent 70%);filter:blur(4px);animation:shimmer 3s ease-in-out infinite}

@keyframes shimmer{50%{opacity:.5;transform:scaleX(1.3)}}
.wave{position:absolute;left:0;width:200%;animation:wave 7s linear infinite}

@keyframes wave{to{transform:translateX(-50%)}}

.bottle.go{animation:drift 3.2s cubic-bezier(.4,0,.6,1) forwards}
@keyframes drift{
  0%{transform:translate(0,0) rotate(-10deg) scale(1);opacity:1}

.bottle.gone{display:none}
.sea-msg{position:absolute;left:0;right:0;top:44%;text-align:center;z-index:4;font-size:15px;color:var(--text);text-shadow:0 2px 8px rgba(0,0,0,.6)}
textarea.wish{width:100%;min-height:120px;resize:none;border-radius:16px;padding:14px;font-size:17px;line-height:1.6;color:var(--text);
  background:rgba(255,255,255,.06);border:1px solid var(--line);outline:none}
textarea.wish:focus{border-color:rgba(180,140,255,.7)}
textarea.wish::placeholder{color:rgba(185,175,219,.6)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
.wlist{list-style:none;margin:0;padding:0}
.wlist li{padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
.wlist li:first-child{border-top:0}

/* 生日當天的驚喜 */
.bparty{position:fixed;inset:0;z-index:95;background:rgba(5,3,22,0);transition:background 1s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overflow:hidden}

.bday-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}

.cake{width:min(72vw,280px);transition:transform .9s cubic-bezier(.5,0,.8,.4),opacity .9s;cursor:pointer;filter:drop-shadow(0 10px 30px rgba(255,170,220,.25))}
.cake svg{width:100%;height:auto;display:block;overflow:visible}

.bday-hold{width:180px;height:8px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:18px;overflow:hidden;transition:opacity .4s}

.parade{position:absolute;left:0;right:0;bottom:16%;display:flex;justify-content:center;align-items:flex-end;transform:translateX(-130vw);transition:transform 2.6s cubic-bezier(.35,.5,.25,1)}

@keyframes walk{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-8px) rotate(6deg)}}

.gift{position:relative;width:112px;height:124px;margin:0 2px 2px;cursor:pointer;transform-origin:50% 100%;z-index:1}
.gift .gbox{position:absolute;left:12px;right:12px;bottom:0;height:78px;background:linear-gradient(#ff8fc7,#e45a9c);border-radius:8px;box-shadow:inset 0 -12px 0 rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.4)}
.gift .gbox:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:18px;margin-left:-9px;background:#ffd98a}

.gift .lid:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:18px;margin-left:-9px;background:#ffd98a}
.gift .bow{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);font-size:34px;line-height:1;transition:transform .7s,opacity .5s}
.parade.ready .gift{animation:giftWiggle 1.1s ease-in-out infinite}
@keyframes giftWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scale(1.03)}75%{transform:rotate(4deg) scale(1.03)}}
.parade.open .gift{animation:giftPop .5s ease-out}
@keyframes giftPop{30%{transform:scale(1.15,.85)}60%{transform:scale(.92,1.1)}}
.parade.open .gift .lid{transform:translate(-30px,-150px) rotate(-40deg);opacity:0}
.parade.open .gift .bow{transform:translate(-50%,-160px) rotate(30deg);opacity:0}
.bday-gain{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:42px;font-weight:700;color:#ffd98a;text-shadow:0 0 16px rgba(255,217,138,.9),0 2px 8px rgba(0,0,0,.6);opacity:0;transform:translateY(20px);transition:.5s;pointer-events:none}
.bday-gain.show{opacity:1;transform:none}
.bday-coupon{position:absolute;left:24px;right:24px;top:44%;transform:translateY(-50%) scale(.7);opacity:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,217,138,.22),rgba(255,143,199,.22));border:1px solid rgba(255,217,138,.6);border-radius:22px;padding:18px 18px 16px;text-align:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.5);transition:transform .7s cubic-bezier(.2,1.4,.4,1),opacity .4s}
.bday-coupon.show{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
.bday-coupon .ce{font-size:44px;line-height:1.1}
.bday-coupon h3{margin:6px 0 2px;font-size:22px;color:#fff2c4}
.bday-coupon p{margin:4px 0 0;color:var(--muted);font-size:14px}
.bday-coupon .btn{margin-top:14px}
/* 綿綿樹洞 */
.tree-scene{margin:2px -6px 12px}
.tree-scene svg{width:100%;height:auto;display:block;overflow:visible}
.tree-scene .animal{font-size:22px;transform-box:fill-box;transform-origin:50% 100%;animation:animalBob 3.2s ease-in-out infinite;cursor:pointer}
@keyframes animalBob{50%{transform:translateY(-3px)}}
/* Q 版圖片的小動物：待機時輕輕呼吸浮動，點一下會蹦起來 */
.tree-scene image.animal{animation:animalIdle 3.4s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
@keyframes animalIdle{50%{transform:translateY(-3px) scale(.985,1.03)}}
.tree-scene .animal.jump{animation:animalJump .62s cubic-bezier(.3,1.3,.5,1) 1}
@keyframes animalJump{0%{transform:scale(1.15,.82)}40%{transform:translateY(-18px) scale(.94,1.1) rotate(-6deg)}72%{transform:translateY(0) scale(1.12,.88)}100%{transform:none}}
.a-img{width:44px;height:44px;object-fit:contain;display:inline-block;vertical-align:middle;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
span.a-img{font-size:26px;line-height:44px;text-align:center}

.tree-scene .firefly{animation:twinkle 2.4s ease-in-out infinite}
.tree-scene .hole-hit{cursor:pointer}
.moods{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mood{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;font-size:14px;color:var(--muted);background:rgba(255,255,255,.06);border:1px solid var(--line);transition:transform .15s}
.mood:active{transform:scale(.96)}
.mood.on{color:#1a1430;background:var(--c);border-color:var(--c);font-weight:700;box-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
textarea.leaf-ta{min-height:100px}
.leaf-fly{position:fixed;z-index:95;width:38px;height:38px;pointer-events:none;transition:transform 1s cubic-bezier(.3,.7,.3,1),opacity 1s ease-in}
.llist{list-style:none;margin:0;padding:0}
.llist li{display:flex;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
.llist li:first-child{border-top:0}
.llist .l-ic{flex:none;width:36px;height:36px;border-radius:50% 0 50% 50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--c);transform:rotate(-20deg)}
.llist .l-ic span{transform:rotate(20deg)}
.llist .l-body{flex:1;min-width:0}
.animals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ani{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:11px;color:var(--muted);text-align:center}
.ani .a-e{font-size:26px;line-height:1.2}
.ani.off .a-e{filter:grayscale(1);opacity:.35}
.ani.on{border-color:rgba(143,214,148,.5);background:rgba(143,214,148,.1);color:var(--text)}
.wish-preview{background:rgba(255,255,255,.06);border-radius:14px;padding:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;text-align:left;max-height:200px;overflow:auto}

/* ---------- 底部選單 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;
  background:rgba(12,10,40,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar .inner{display:flex;width:100%;max-width:480px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:5px 0;letter-spacing:0;white-space:nowrap}
.tab .ic{font-size:22px;line-height:1.1;filter:grayscale(.7) opacity(.65);transition:transform .2s,filter .2s}
.tab.active{color:var(--text)}
.tab.active .ic{filter:none;transform:translateY(-2px) scale(1.1)}

/* ---------- 彈窗與提示 ---------- */
.modal-bg{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(3,2,15,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .2s}
.modal-bg.out{animation:fade .18s reverse forwards}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:360px;max-height:85vh;overflow:auto;text-align:center;border-radius:26px;padding:24px 20px 18px;
  background:linear-gradient(160deg,#2a1e66,#16103d);border:1px solid rgba(255,255,255,.15);box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.m-icon{font-size:52px;margin-bottom:6px;filter:drop-shadow(0 0 14px rgba(255,217,138,.5))}
.sheet h3{font-size:20px;margin-bottom:10px;line-height:1.4}
.m-body{line-height:1.7;color:var(--text);font-size:15px}
.m-body p+p{margin-top:8px}
.m-body .left{text-align:left}
.m-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.m-btns .btn{flex:1 1 120px;padding:12px 14px}
.input{width:100%;padding:12px 14px;margin-top:12px;border-radius:14px;font-size:17px;color:var(--text);text-align:center;
  background:rgba(255,255,255,.07);border:1px solid var(--line);outline:none}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:95;
  background:rgba(30,22,80,.95);border:1px solid rgba(255,255,255,.16);padding:11px 18px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="app">
  <header class="topbar">
    <div class="brand" id="brand"><span>✦</span> 星星小宇宙</div>

<script>
(function(){
'use strict';

/* ================= 基本工具 ================= */
const C = window.APP_CONFIG;
if (!C) { document.body.innerHTML = '<p style="padding:40px;color:#fff">找不到 config.js，請確認它和 index.html 放在同一個資料夾。</p>'; return; }
C.games = C.games || {}; C.ntfy = C.ntfy || {}; C.wheel = C.wheel || {prizes:[]}; C.shop = C.shop || [];

const PN = C.pointName || '星星';
const PE = C.pointEmoji || '⭐';
const STORE_KEY = 'starbox_v1';
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br = s => esc(s).replace(/\n/g, '<br>');
// 把訊息裡的 {第幾天}、{生日倒數}、{名字} 換成實際數值
function fillTpl(s) {
  const now = new Date(), bd = birthdayDays();
  return String(s || '')
    .replace(/\{第幾天\}/g, now.getDate())
    .replace(/\{生日倒數\}/g, bd === null ? '' : bd)
    .replace(/\{名字\}/g, C.herName || '')
    .replace(/\{署名\}/g, C.fromName || '');
}
// 生日月（依 birthday 的月份）且有設定 birthMonthMessage 時顯示它，否則顯示 homeMessage
function homeMessage() {
  const m = /^(\d{1,2})-/.exec(String(C.birthday || '').trim());
  const inBirthMonth = m && new Date().getMonth() + 1 === +m[1];
  return fillTpl(inBirthMonth && C.birthMonthMessage ? C.birthMonthMessage : C.homeMessage);
}
const rand = (a, b) => a + Math.random() * (b - a);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');

/* ================= ntfy 通知 ================= */
const hasTopic = () => !!(C.ntfy.topic && String(C.ntfy.topic).trim());
async function sendNtfy(msg) {
  if (!hasTopic()) return 'skip';
  try {
    const res = await fetch(String(C.ntfy.server || 'https://ntfy.sh').replace(/\/+$/, ''), {
      method: 'POST',
      body: JSON.stringify({ topic: String(C.ntfy.topic).trim(), title: msg.title, message: msg.message, tags: msg.tags || [], priority: msg.priority || 4 })
    });
    return res.ok ? 'ok' : 'fail';
  } catch (e) { return 'fail'; }
}
function markSent(msg) {
  if (msg.wishId) { const w = S.wishes.find(x => x.id === msg.wishId); if (w) w.sent = true; }
  if (msg.leafId) { const l = (S.leaves || []).find(x => x.id === msg.leafId); if (l) l.sent = true; }
}
async function notify(msg) {
  const r = await sendNtfy(msg);
  if (r === 'ok') markSent(msg);
  if (r === 'fail') S.outbox.push(msg);
  save();
  return r;
}
let flushing = false;
async function flushOutbox() {
  if (flushing || !S.outbox.length || !hasTopic()) return;
  flushing = true;
  const pending = S.outbox.splice(0); save();
  for (const m of pending) {
    const r = await sendNtfy(m);
    if (r === 'ok') markSent(m); else S.outbox.push(m);
  }
  save(); flushing = false;
  if (current === 'wish') render.wish();
  if (current === 'tree') render.tree();
}

function modal({ icon = '', title = '', html = '', buttons = [{ text: '好', primary: true }], dismiss = true, onOpen = null } = {}) {
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="sheet">${icon ? `<div class="m-icon">${icon}</div>` : ''}${title ? `<h3>${title}</h3>` : ''}
      <div class="m-body">${html}</div>

    document.body.appendChild(bg);
    let done = false;
    const close = i => {
      if (done) return; done = true;
      const values = {};
      $$('input,textarea', bg).forEach(el => { if (el.name) values[el.name] = el.value; });
      bg.classList.add('out'); setTimeout(() => { bg.remove(); showBadgeQueue(); }, 180);
      resolve({ i, values });

    bg.addEventListener('click', e => {
      const b = e.target.closest('[data-i]');
      if (b) return close(+b.dataset.i);
      if (e.target === bg && dismiss) close(-1);
    });
    const inp = $('input', bg); if (inp) setTimeout(() => inp.focus(), 250);
    if (onOpen) onOpen(bg, close);
  });
}

/* ================= 星空背景 ================= */
const sky = $('#sky'), sctx = sky.getContext('2d');
let stars = [], shoot = null, nextShoot = 0, W = 0, H = 0;
function initSky() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  sky.width = W * dpr; sky.height = H * dpr; sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(W * H / 2400);
  stars = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() < .08 ? rand(1.2, 1.9) : rand(.3, 1.1), p: Math.random() * 6.28, s: rand(.4, 1.6) }));
}
function skyLoop(t) {
  requestAnimationFrame(skyLoop);
  if (document.hidden) return;
  sctx.clearRect(0, 0, W, H);
  for (const s of stars) {
    const a = .25 + .75 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
    sctx.globalAlpha = a;
    sctx.fillStyle = s.r > 1.15 ? '#fff4d6' : '#ffffff';
    if (s.r > 1.15) { sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 6.283); sctx.fill(); sctx.globalAlpha = a * .18; sctx.beginPath(); sctx.arc(s.x, s.y, s.r * 4, 0, 6.283); sctx.fill(); }
    else sctx.fillRect(s.x, s.y, s.r * 1.4, s.r * 1.4);
  }
  sctx.globalAlpha = 1;
  if (!nextShoot) nextShoot = t + 2500;
  if (!shoot && t > nextShoot) shoot = { x: rand(W * .3, W * 1.05), y: rand(0, H * .35), vx: -rand(6, 9), vy: rand(2.5, 4), life: 1 };
  if (shoot) {
    const { x, y, vx, vy } = shoot;
    const g = sctx.createLinearGradient(x, y, x - vx * 14, y - vy * 14);
    g.addColorStop(0, `rgba(255,255,255,${shoot.life})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    sctx.strokeStyle = g; sctx.lineWidth = 2; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(x, y); sctx.lineTo(x - vx * 14, y - vy * 14); sctx.stroke();
    shoot.x += vx; shoot.y += vy; shoot.life -= .018;
    if (shoot.life <= 0 || shoot.x < -100) { shoot = null; nextShoot = t + rand(4000, 9000); }
  }
}

/* ================= 慶祝特效 ================= */
const fx = $('#fx'), fctx = fx.getContext('2d');
let parts = [], fxOn = false;
function sizeFx() { const dpr = Math.min(2, window.devicePixelRatio || 1); fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; fctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
function starPath(ctx, x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5; const rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath();
}
function sparkle(x = innerWidth / 2, y = innerHeight * .42, n = 90) {
  const cols = ['#ffd98a', '#ff9ecf', '#b48cff', '#8fe3ff', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(2, 8);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.5, life: 1, d: rand(.008, .016), r: rand(3, 7), rot: Math.random() * 6, vr: rand(-.2, .2), c: cols[i % cols.length] });
  }
  if (!fxOn) { fxOn = true; requestAnimationFrame(fxLoop); }
}
function fxLoop() {
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of parts) {
    p.vy += .1; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.d;
    fctx.globalAlpha = Math.max(0, p.life); fctx.fillStyle = p.c; starPath(fctx, p.x, p.y, p.r, p.rot); fctx.fill();
  }
  fctx.globalAlpha = 1;
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  if (parts.length) requestAnimationFrame(fxLoop); else { fxOn = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ================= 每日輪盤 ================= */
const prizes = (C.wheel.prizes || []).filter(p => p && p.label);
const segDeg = () => 360 / Math.max(1, prizes.length);
let wheelBuilt = false, wheelRot = 0, spinning = false;

function splitLabel(s) {
  s = String(s);
  if (s.length <= 4) return [s];
  const sp = s.indexOf(' ');
  if (sp > 0 && sp < s.length - 1) return [s.slice(0, sp), s.slice(sp + 1)];
  const mid = Math.ceil(s.length / 2);
  return [s.slice(0, mid), s.slice(mid)];
}
function drawWheel() {
  const cv = $('#wheel'); if (!cv) return;
  const size = cv.clientWidth; if (!size) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = size * dpr; cv.height = size * dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = size / 2, n = prizes.length, seg = Math.PI * 2 / n;
  const pal = C.wheel.colors && C.wheel.colors.length ? C.wheel.colors : ['#3b2a8c', '#5b2f9e', '#22357f', '#7a3a9c'];
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI / 2 + i * seg;
    ctx.beginPath(); ctx.moveTo(r, r); ctx.arc(r, r, r, a0, a0 + seg); ctx.closePath();
    ctx.fillStyle = pal[(n % pal.length === 1 && i === n - 1) ? (i + 1) % pal.length : i % pal.length]; ctx.fill();
  }
  const sh = ctx.createRadialGradient(r, r, r * .15, r, r, r);
  sh.addColorStop(0, 'rgba(255,255,255,.16)'); sh.addColorStop(.7, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,.28)');
  ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(r, r, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,217,138,.6)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * seg; ctx.beginPath(); ctx.moveTo(r, r); ctx.lineTo(r + Math.cos(a) * r, r + Math.sin(a) * r); ctx.stroke(); }
  const fontOf = fs => `700 ${fs}px "LXGW WenKai TC","PingFang TC",sans-serif`;
  for (let i = 0; i < n; i++) {
    const p = prizes[i];
    ctx.save(); ctx.translate(r, r); ctx.rotate((i + .5) * seg);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
    ctx.font = `${Math.round(r * .15)}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
    ctx.fillText(p.emoji || '✨', 0, -r * .76);
    const lines = splitLabel(p.label);
    const yc = -r * .5;
    const chord = Math.min(r * .8, 2 * (r * .44) * Math.tan(seg / 2)) * .92;
    let fs = Math.round(r * .115);
    ctx.font = fontOf(fs);
    while (fs > 8 && Math.max(...lines.map(l => ctx.measureText(l).width)) > chord) { fs--; ctx.font = fontOf(fs); }
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 4;
    lines.forEach((l, li) => ctx.fillText(l, 0, yc + (li - (lines.length - 1) / 2) * fs * 1.18));
    ctx.restore();
  }
  for (let k = 0; k < n * 3; k++) {
    const a = -Math.PI / 2 + k * seg / 3;
    ctx.beginPath(); ctx.arc(r + Math.cos(a) * (r - 6), r + Math.sin(a) * (r - 6), 2.3, 0, Math.PI * 2);
    ctx.fillStyle = k % 2 ? '#fff4d6' : '#ffd98a'; ctx.fill();
  }
}
function pickWeighted() {
  const ws = prizes.map(p => Math.max(0, Number(p.weight ?? 1)) || 0);
  const total = ws.reduce((a, b) => a + b, 0) || prizes.length;
  let x = Math.random() * total;
  for (let i = 0; i < prizes.length; i++) { x -= (ws[i] || (total === prizes.length ? 1 : 0)); if (x < 0) return i; }
  return prizes.length - 1;
}
render.wheel = () => {
  const P = $('#p-wheel');
  if (!prizes.length) { P.innerHTML = '<h2 class="ptitle">每日幸運輪盤</h2><p class="muted center">還沒有設定輪盤獎賞喔</p>'; return; }
  if (!wheelBuilt) {
    P.innerHTML = `<h2 class="ptitle">每日幸運輪盤</h2>
      <p class="muted center">每天可以轉一次，轉到什麼就是什麼 ✨</p>
      <div class="wheel-wrap">
        <svg class="pointer" viewBox="0 0 34 42"><defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#fff2c4"/><stop offset="1" stop-color="#e8a840"/></linearGradient></defs><path d="M17 41 L3 12 A15 15 0 1 1 31 12 Z" fill="url(#pg)" stroke="#fff6dc" stroke-width="1.5"/><circle cx="17" cy="14" r="5" fill="#2a1e66"/></svg>
        <canvas id="wheel"></canvas>
        <button class="spin-btn" id="spinBtn">轉！</button>
      </div>
      <div class="card center" id="wheelStatus"></div>
      <div class="card"><h4>我抽到的獎賞</h4><div id="spinHist"></div></div>`;
    wheelBuilt = true;
    drawWheel();
    $('#spinBtn').onclick = spin;
    const s = todaySpin();
    if (s) { const idx = prizes.findIndex(p => p.label === s.label); if (idx >= 0) { wheelRot = 360 - (idx + .5) * segDeg(); $('#wheel').style.transform = `rotate(${wheelRot}deg)`; } }
  }
  updateWheel();
};
function updateWheel() {
  const btn = $('#spinBtn'); if (!btn) return;
  const s = todaySpin();
  btn.disabled = !!s || spinning;
  btn.textContent = spinning ? '…' : s ? '✓' : '轉！';
  $('#wheelStatus').innerHTML = spinning
    ? '<div class="big">轉呀轉…</div><div class="muted small">好運正在路上</div>'
    : s ? `<div class="muted">今天抽到的是</div><div class="big">${esc(s.emoji)} ${esc(s.label)}</div><div class="muted small">${s.points ? `${PE} +${s.points} 已經存進去囉` : '兌換券放在「兌換」頁'}・明天再來轉 🌙</div>`
        : '<div class="big">今天還沒轉喔</div><div class="muted small">點中間的按鈕開始</div>';
  const list = Object.values(S.spins).filter(x => !(spinning && x === s)).sort((a, b) => b.t - a.t).slice(0, 30);
  $('#spinHist').innerHTML = list.length
    ? '<ul class="hist">' + list.map(x => `<li><span class="h-ic">${esc(x.emoji)}</span><span class="h-txt">${esc(x.label)}<small>${fmtDate(x.t)}</small></span>${x.points ? `<span class="plus">+${x.points}</span>` : ''}</li>`).join('') + '</ul>'
    : '<div class="empty">還沒有轉過</div>';
}
function spin() {
  if (spinning || todaySpin() || !prizes.length) return;
  const idx = pickWeighted(), p = prizes[idx];
  spinning = true;
  // 先記錄，避免轉到一半關掉 App 重來
  S.spins[dayKey()] = { label: p.label, emoji: p.emoji || '✨', t: Date.now(), points: p.points || 0 };
  if (p.points) { S.points += p.points; log('🎡', `輪盤抽中 ${p.label}`, p.points); }
  else { S.coupons.unshift({ id: uid(), name: p.label, emoji: p.emoji || '🎁', source: '輪盤', t: Date.now(), used: false }); log('🎡', `輪盤抽中 ${p.label}`); }
  save();
  updateWheel();
  const seg = segDeg(), center = (idx + .5) * seg, jitter = (Math.random() - .5) * seg * .6;
  const base = wheelRot - (((wheelRot % 360) + 360) % 360);
  const target = base + 360 * 7 + (360 - center) + jitter;
  wheelRot = target;
  const w = $('#wheel');
  w.style.transition = 'transform 5.4s cubic-bezier(.12,.72,.1,1)';
  requestAnimationFrame(() => { w.style.transform = `rotate(${target}deg)`; });
  setTimeout(async () => {
    w.style.transition = 'none';
    spinning = false;
    renderPoints(!!p.points); updateWheel(); sparkle();
    if (C.ntfy.notifySpin) notify({ title: `🎡 ${C.herName} 的今日輪盤`, message: `抽到：${p.emoji || ''} ${p.label}${p.points ? `（+${p.points} ${PN}）` : ''}\n${fmtTime(Date.now())}`, tags: ['ferris_wheel'], priority: 3 });
    await modal({
      icon: esc(p.emoji || '🎉'), title: `抽到「${esc(p.label)}」！`,
      html: p.points ? `<p>${PE} +${p.points} ${PN}已經存進去囉</p>` : `<p>已經放進「兌換」頁的<b>我的兌換券</b>，<br>拿去找${esc(C.fromName)}兌現吧！</p>`,
      buttons: [{ text: '太棒了', primary: true }]
    });
    checkBadges();
  }, 5550);
}

const GAMES = {

  memory: { name: '星座翻牌', emoji: '🃏', desc: '翻開卡片找出成對的圖案，步數越少越好', start: startMemory, max: () => cfgOf('memory').maxPoints ?? 40 },
  catch:  { name: '接流星',   emoji: '🌠', desc: '左右拖動月亮接住流星，小心烏雲', start: startCatch,  max: () => cfgOf('catch').maxPoints ?? 40 },
  quiz:   { name: '情侶問答', emoji: '💞', desc: '你有多了解我們？答對越多星星越多',     start: startQuiz,   max: () => { const q = cfgOf('quiz'); const n = Math.min(q.questionsPerRound ?? 5, (q.questions || []).length); return n * (q.pointsPerCorrect ?? 8) + (n ? (q.perfectBonus ?? 0) : 0); } },
};
const cfgOf = k => C.games[k] || {};

const maxPlays = k => cfgOf(k).maxPlaysPerDay ?? C.games.maxPlaysPerDay ?? 3;
const playsToday = k => (S.plays[dayKey()] || {})[k] || 0;
const playsLeft = k => Math.max(0, maxPlays(k) - playsToday(k));
function addPlay(k) { const d = dayKey(); S.plays[d] = S.plays[d] || {}; S.plays[d][k] = (S.plays[d][k] || 0) + 1; }

render.games = () => {

const game = { key: null, playing: false, cleanup: null };
function openGame(k) {

$('#gExit').onclick = async () => {

async function finishGame(k, pts, summary, icon) {

/* ---------- 撈星星（打地鼠） ---------- */
function startWhack(body, stat) {
  const cfg = Object.assign({ seconds: 30, pointsPerHit: 1, maxPoints: 40 }, cfgOf('whack'));
  let score = 0, left = cfg.seconds, iv = null;
  const timers = new Set();
  const T = (fn, ms) => { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; };
  body.innerHTML = `<p class="game-hint">星星從洞裡冒出來時快點它！<br>⭐ +1　💖 +3　⛈️ −2</p>
    <div class="whack-grid">${Array.from({ length: 9 }, (_, i) => `<div class="hole" data-i="${i}"><div class="pit"><div class="mole"></div></div></div>`).join('')}</div>
    <div class="center" id="wCtl"><button class="btn" id="wGo">準備好了，開始！</button></div>`;
  const setStat = () => { stat.textContent = `⏱${left}  ★${score}`; };
  setStat();
  const holes = $$('.hole', body);
  const hide = h => { h.classList.remove('up'); T(() => { if (!h.classList.contains('up')) h.classList.remove('hit', 'shake'); }, 200); };
  function pop(h) {
    const r = Math.random(); let e, v;
    if (r < .08) { e = '💖'; v = 3; } else if (r < .28) { e = '⛈️'; v = -2; } else { e = '⭐'; v = 1; }
    h.classList.remove('hit', 'shake');
    h.querySelector('.mole').textContent = e;
    h.dataset.v = v;
    const tok = uid(); h.dataset.tok = tok;
    h.classList.add('up');
    const progress = 1 - left / cfg.seconds;
    T(() => { if (h.dataset.tok === tok) hide(h); }, 1050 - progress * 420);
  }
  function spawn() {
    if (!game.playing) return;
    const progress = 1 - left / cfg.seconds;
    const free = holes.filter(h => !h.classList.contains('up'));
    if (free.length) pop(free.splice(Math.floor(Math.random() * free.length), 1)[0]);
    if (progress > .5 && free.length && Math.random() < .35) pop(free[Math.floor(Math.random() * free.length)]);
    T(spawn, rand(420, 720) - progress * 200);
  }
  function floatText(h, txt, good) {
    const f = document.createElement('div'); f.className = 'floatxt ' + (good ? 'good' : 'bad'); f.textContent = txt;
    h.appendChild(f); setTimeout(() => f.remove(), 700);
  }
  holes.forEach(h => h.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!game.playing || !h.classList.contains('up') || h.classList.contains('hit')) return;
    const v = +h.dataset.v;
    score = Math.max(0, score + v);
    h.dataset.tok = '';
    h.classList.add('hit'); if (v < 0) h.classList.add('shake');
    floatText(h, v > 0 ? `+${v}` : `${v}`, v > 0);
    setStat();
    T(() => hide(h), 160);
  }));
  $('#wGo', body).onclick = () => {
    const ctl = $('#wCtl', body);
    let n = 3;
    game.playing = true;   // 倒數開始就算在玩，離開要確認
    const tick = () => {
      if (!game.playing) return;
      if (n > 0) { ctl.innerHTML = `<div class="countdown">${n}</div>`; n--; T(tick, 700); return; }
      ctl.innerHTML = '<div class="muted">加油！</div>';
      iv = setInterval(() => {
        left--; setStat();
        if (left <= 0) {
          clearInterval(iv); iv = null; game.playing = false;
          holes.forEach(hide);
          ctl.innerHTML = '<div class="big gold">時間到！</div>';
          maxStat('whackBest', score);
          T(() => finishGame('whack', Math.min(cfg.maxPoints, score * cfg.pointsPerHit), `撈到了 ${score} 分`, '⭐'), 600);
        }
      }, 1000);
      spawn();
    };
    tick();
  };
  game.cleanup = () => { if (iv) clearInterval(iv); timers.forEach(clearTimeout); timers.clear(); };
}

/* ---------- 接流星（拖動月亮接住流星） ---------- */
function startCatch(body, stat) {
  const cfg = Object.assign({ seconds: 30, pointsPerScore: 1, maxPoints: 40, speed: 1 }, cfgOf('catch'));
  let score = 0, left = cfg.seconds, iv = null, raf = null, running = false, last = 0;
  const timers = new Set();
  const T = (fn, ms) => { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; };
  body.innerHTML = `<p class="game-hint">左右拖動月亮，接住掉下來的流星！<br>⭐ +1　🌟 +3　⛈️ −2</p>
    <div class="catch-wrap"><canvas class="catch" id="cCv"></canvas></div>
    <div class="center" id="cCtl"><button class="btn" id="cGo">準備好了，開始！</button></div>`;
  const cv = $('#cCv', body), ctx = cv.getContext('2d');
  const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  let W = 0, H = 0;
  function size() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth || 320; H = Math.round(Math.min(innerHeight * .56, W * 1.35));
    cv.style.height = H + 'px'; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  const moon = { x: W / 2, tx: W / 2, w: 62 };
  const items = [], floats = [];
  const setStat = () => { stat.textContent = `⏱${left}  ★${score}`; };
  setStat();
  // 月亮直接跟著手指走
  const onPt = e => {
    if (e.pointerType === 'mouse' && e.type === 'pointermove' && e.buttons === 0) return;
    const r = cv.getBoundingClientRect();
    moon.tx = Math.max(moon.w / 2, Math.min(W - moon.w / 2, e.clientX - r.left));
  };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); onPt(e); });
  cv.addEventListener('pointermove', onPt);
  function spawn() {
    if (!running) return;
    const progress = 1 - left / cfg.seconds;
    const r = Math.random(); let e, v;
    if (r < .12) { e = '🌟'; v = 3; } else if (r < .34) { e = '⛈️'; v = -2; } else { e = '⭐'; v = 1; }
    items.push({ x: rand(24, W - 24), y: -30, vy: (rand(150, 210) + progress * 130) * (+cfg.speed || 1), drift: rand(-28, 28), e, v });
    T(spawn, rand(380, 620) - progress * 180);
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const by = H - 36;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // 月亮下方的接取區
    ctx.fillStyle = 'rgba(255,217,138,.12)';
    ctx.beginPath(); ctx.ellipse(moon.x, by + 18, moon.w / 2 + 8, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';   // 畫 emoji 前要用不透明的 fillStyle，否則 Chrome 會把 emoji 一起變淡
    for (const it of items) {
      if (it.v > 0) {   // 流星尾巴
        ctx.strokeStyle = it.v > 1 ? 'rgba(255,217,138,.6)' : 'rgba(255,255,255,.35)'; ctx.lineWidth = it.v > 1 ? 3 : 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(it.x, it.y - 12); ctx.lineTo(it.x - it.drift * .25, it.y - 46); ctx.stroke();
      }
      ctx.font = `${it.v > 1 ? 30 : 26}px ${EMOJI}`; ctx.fillText(it.e, it.x, it.y);
    }
    ctx.font = `46px ${EMOJI}`; ctx.fillText('🌙', moon.x, by);
    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, f.life); ctx.font = '700 18px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillStyle = f.good ? '#ffd98a' : '#ff8aa6'; ctx.fillText(f.txt, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }
  function frame(t) {
    if (!running) return;
    const dt = Math.min(.05, (t - (last || t)) / 1000); last = t;
    moon.x += (moon.tx - moon.x) * Math.min(1, dt * 20);
    const by = H - 36;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i]; it.y += it.vy * dt; it.x += it.drift * dt;
      if (it.y > by - 28 && it.y < by + 14 && Math.abs(it.x - moon.x) < moon.w / 2 + 8) {
        score = Math.max(0, score + it.v); setStat();
        floats.push({ x: it.x, y: by - 34, txt: it.v > 0 ? `+${it.v}` : `${it.v}`, good: it.v > 0, life: 1 });
        items.splice(i, 1); continue;
      }
      if (it.y > H + 30) items.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.y -= 45 * dt; f.life -= dt * 1.5; if (f.life <= 0) floats.splice(i, 1); }
    draw();
    raf = requestAnimationFrame(frame);
  }
  draw();
  $('#cGo', body).onclick = () => {
    const ctl = $('#cCtl', body);
    let n = 3;
    game.playing = true;   // 倒數開始就算在玩，離開要確認
    const tick = () => {
      if (!game.playing) return;
      if (n > 0) { ctl.innerHTML = `<div class="countdown">${n}</div>`; n--; T(tick, 700); return; }
      ctl.innerHTML = '<div class="muted">接住它們！</div>';
      running = true; last = 0;
      iv = setInterval(() => {
        left--; setStat();
        if (left <= 0) {
          clearInterval(iv); iv = null; running = false; game.playing = false;
          if (raf) cancelAnimationFrame(raf); raf = null;
          items.length = 0; draw();
          ctl.innerHTML = '<div class="big gold">時間到！</div>';
          maxStat('catchBest', score);
          T(() => finishGame('catch', Math.min(cfg.maxPoints, score * cfg.pointsPerScore), `接到了 ${score} 分`, '🌠'), 600);
        }
      }, 1000);
      spawn();
      raf = requestAnimationFrame(frame);
    };
    tick();
  };
  game.cleanup = () => { running = false; if (iv) clearInterval(iv); if (raf) cancelAnimationFrame(raf); timers.forEach(clearTimeout); timers.clear(); };
}

/* ---------- 星座翻牌（翻牌配對） ---------- */
function startMemory(body, stat) {
  const cfg = Object.assign({ symbols: ['🌙', '⭐', '🪐', '☄️', '🌸', '💜', '🐰', '🍓'], maxPoints: 40, minPoints: 10, penaltyPerExtraMove: 2 }, cfgOf('memory'));
  const syms = cfg.symbols.slice(0, 8);
  const deck = shuffle([...syms, ...syms]);
  let first = null, lock = false, moves = 0, matched = 0, t0 = 0, iv = null;
  const setStat = () => { const sec = t0 ? Math.floor((Date.now() - t0) / 1000) : 0; stat.textContent = `${moves}步 ⏱${sec}`; };
  body.innerHTML = `<p class="game-hint">翻開兩張一樣的就配對成功<br>${syms.length} 步完美通關，步數越少${PN}越多</p>
    <div class="mgrid">${deck.map((s, i) => `<button class="mcard" data-i="${i}"><div class="inner"><div class="face back">✦</div><div class="face front">${esc(s)}</div></div></button>`).join('')}</div>`;
  setStat();
  const cards = $$('.mcard', body);
  cards.forEach(el => el.addEventListener('click', () => {
    const i = +el.dataset.i;
    if (lock || el.classList.contains('flip')) return;
    if (!t0) { t0 = Date.now(); game.playing = true; iv = setInterval(setStat, 1000); }
    el.classList.add('flip');
    if (first === null) { first = i; return; }
    const a = first; first = null; moves++; setStat();
    if (deck[a] === deck[i]) {
      cards[a].classList.add('matched'); el.classList.add('matched'); matched++;
      if (matched === syms.length) {
        clearInterval(iv); iv = null; game.playing = false;
        const sec = Math.floor((Date.now() - t0) / 1000);
        const pts = Math.max(cfg.minPoints, Math.min(cfg.maxPoints, cfg.maxPoints - (moves - syms.length) * cfg.penaltyPerExtraMove));
        if (moves === syms.length) addStat('memoryPerfect');
        setTimeout(() => finishGame('memory', pts, `${moves} 步、${sec} 秒完成配對${moves === syms.length ? '，完美！' : ''}`, '🃏'), 700);
      }
    } else {
      lock = true;
      setTimeout(() => { cards[a].classList.remove('flip'); el.classList.remove('flip'); lock = false; }, 850);
    }
  }));
  game.cleanup = () => { if (iv) clearInterval(iv); };
}

/* ---------- 情侶問答 ---------- */
function startQuiz(body, stat) {
  const cfg = Object.assign({ questionsPerRound: 5, pointsPerCorrect: 8, perfectBonus: 10, questions: [] }, cfgOf('quiz'));
  const pool = (cfg.questions || []).filter(q => q && q.q && Array.isArray(q.options) && q.options.length > 1);
  const qs = shuffle(pool.slice()).slice(0, Math.min(cfg.questionsPerRound, pool.length));
  if (!qs.length) { body.innerHTML = '<p class="center muted" style="margin-top:40px">還沒有設定題目喔</p>'; return; }
  let i = 0, correct = 0;
  game.playing = true;
  function show() {
    const q = qs[i];
    stat.textContent = `${i + 1}/${qs.length}`;
    const opts = shuffle(q.options.map((t, j) => ({ t, ok: j === q.answer })));
    let answered = false;
    body.innerHTML = `<div class="qbar"><div style="width:${i / qs.length * 100}%"></div></div>
      <div class="card"><div class="muted small">第 ${i + 1} 題・答對 ${correct} 題</div>
        <div class="qtext">${esc(q.q)}</div>
        ${opts.map((o, j) => `<button class="opt" data-j="${j}">${esc(o.t)}</button>`).join('')}
        <div class="qnote" id="qnote"></div>
      </div>
      <div class="center"><button class="btn hidden" id="qNext">${i === qs.length - 1 ? '看結果 ✨' : '下一題 →'}</button></div>`;
    const btns = $$('.opt', body);
    btns.forEach(b => b.onclick = () => {
      if (answered) return; answered = true;
      const o = opts[+b.dataset.j];
      btns.forEach((x, k) => { x.disabled = true; if (opts[k].ok) x.classList.add('right'); });
      if (o.ok) { correct++; addStat('quizCorrect'); } else b.classList.add('wrong');
      $('#qnote', body).innerHTML = (o.ok ? '<b class="ok">答對了！</b> ' : '<b class="ng">差一點～</b> ') + (q.note ? esc(q.note) : '');
      $('.qbar div', body).style.width = ((i + 1) / qs.length * 100) + '%';
      $('#qNext', body).classList.remove('hidden');
    });
    $('#qNext', body).onclick = () => {
      i++;
      if (i < qs.length) { show(); $('#game').scrollTop = 0; return; }
      game.playing = false;
      const perfect = correct === qs.length;
      finishGame('quiz', correct * cfg.pointsPerCorrect + (perfect ? cfg.perfectBonus : 0), `答對 ${correct} / ${qs.length} 題${perfect ? '，全對！你最懂我了' : ''}`, perfect ? '💯' : '💞');
    };
  }
  show();
}

/* ================= 偷星怪客 ================= */
const thiefCfg = () => Object.assign({ enabled: true, chance: 0.3, steal: 15, maxPerDay: 1, minPoints: 10, name: '偷星怪客', emoji: '👾', image: '', questions: [] }, C.thief || {});
function thiefPool() {
  const own = thiefCfg().questions || [], quiz = cfgOf('quiz').questions || [];
  return (own.length ? own : quiz).filter(q => q && q.q && Array.isArray(q.options) && q.options.length > 1);
}
// 打開 App／回到前景時呼叫：依機率決定要不要跳出怪客
function maybeThief() {
  const t = thiefCfg();
  if (!t.enabled || !S.welcomed || game.key || bdayActive || $('.modal-bg')) return;
  const d = dayKey(), n = (S.thief || {})[d] || 0;
  if (n >= t.maxPerDay || S.points < t.minPoints) return;
  const pool = thiefPool();
  if (!pool.length || Math.random() >= t.chance) return;
  if (!S.thief) S.thief = {};
  S.thief[d] = n + 1; save();
  thiefAttack(pool[Math.floor(Math.random() * pool.length)]);
}
async function thiefAttack(q) {
  const t = thiefCfg();
  const steal = Math.min(S.points, Math.max(0, +t.steal || 0));
  const opts = shuffle(q.options.map((txt, j) => ({ txt, ok: j === q.answer })));
  await modal({
    icon: t.image ? `<img class="thief-img" src="${esc(t.image)}" alt="${esc(t.name)}" onerror="this.outerHTML='${esc(t.emoji)}'">` : esc(t.emoji),
    title: `${esc(t.name)}出現了！`, dismiss: false,
    html: `<p>牠想偷走你 <b class="gold">${PE} ${steal} 顆${PN}</b>！<br>答對問題就能把牠趕走</p>
      <div class="qtext">${esc(q.q)}</div>
      ${opts.map((o, j) => `<button class="opt" data-j="${j}">${esc(o.txt)}</button>`).join('')}
      <div class="qnote" id="tnote"></div>`,
    buttons: [{ text: '好', primary: true }],
    onOpen(bg) {
      $('.m-icon', bg).classList.add('thief');
      const btns = $$('.opt', bg), okBtn = $('.m-btns', bg), note = $('#tnote', bg);

// 決定一個商店品項的結果：dice 擲骰、scratch 抽獎品（刮到「再刮一次」就免費再刮一張）；兌換和收小動物禮物都用這個
function drawPrize(it) {
  const faces = Array.isArray(it.dice) ? it.dice.filter(Boolean).slice(0, 6) : [];

  const isAgain = x => /再刮/.test(String(x));

  if (win && isAgain(win) && pool.some(x => !isAgain(x))) { again = true; win = pick(pool.filter(x => !isAgain(x))); }
  return { roll, faces, win, again, name: roll ? `${it.name}：${roll.text}` : win ? `${it.name}：${win}` : it.name };

// 播放品項的動畫（骰子／刮刮卡），沒有的話什麼都不做

// 刮刮卡：canvas 塗層蓋住獎品，手指刮掉一半以上就自動全部揭曉
function scratchCard(it, win, isAgainCard = false) {
  return modal({
    title: `${esc(it.emoji || '🎟️')} ${esc(it.name)}`, dismiss: false,
    html: `<div class="scratch"><div class="s-prize"><div class="s-big">🎁</div><div class="s-txt">${esc(win)}</div></div><canvas class="s-cover" id="sCv"></canvas></div>

    buttons: [{ text: isAgainCard ? '再刮一張 🎟️' : '收下！', primary: true }],
    onOpen(bg) {
      const cv = $('#sCv', bg), ctx = cv.getContext('2d'), btns = $('.m-btns', bg), msg = $('#sMsg', bg);
      btns.classList.add('hidden');
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = cv.clientWidth || 270, H = cv.clientHeight || 156;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.fillStyle = '#3b2a6e'; ctx.font = '700 20px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'center';
      ctx.fillText('👆 刮開我', W / 2, H / 2 + 7);

        return clear / total;
      };

        if (done) return; done = true;
        cv.classList.add('done');
        msg.innerHTML = isAgainCard ? `刮到 <b class="gold">再刮一次</b>！免費再送你一張 🎉` : `刮到了：<b class="gold">${esc(win)}</b> 🎉`;

const backendCfg = () => Object.assign({ url: '', appKey: '' }, C.backend || {});

  if (bdayActive) return; bdayActive = true;
  const b = bdayCfg(), n = Math.max(1, Math.min(9, +b.candles || 5)), holdS = Math.max(1, +b.holdSeconds || 5), wait = ms => new Promise(r => setTimeout(r, ms));
  const ov = document.createElement('div'); ov.className = 'bparty'; ov.innerHTML = '<canvas></canvas><div class="bday-stage"></div>';
  document.body.appendChild(ov);
  const stage = $('.bday-stage', ov), fx = bdayFx($('canvas', ov));
  requestAnimationFrame(() => ov.classList.add('dim'));
  // 1. 按住蛋糕把蠟燭吹熄（放開會暫停，再按繼續）
  stage.innerHTML = `<p class="bday-hint">按住蛋糕 ${holdS} 秒，把蠟燭吹熄 🌬️</p><div class="cake">${cakeSvg(n)}</div><div class="bday-hold"><i></i></div>`;
  const cake = $('.cake', ov), hint = $('.bday-hint', ov), bar = $('.bday-hold i', ov), candles = $$('.candle', ov);
  await new Promise(res => {
    let held = false, acc = 0, last = 0, out = 0;
    const on = e => { e.preventDefault(); held = true; cake.classList.add('hold'); hint.textContent = '呼———'; hint.classList.add('go'); };
    const off = () => { held = false; cake.classList.remove('hold'); if (out < n) { hint.textContent = `還有 ${n - out} 根，繼續按住 🌬️`; hint.classList.remove('go'); } };
    cake.addEventListener('pointerdown', on); ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cake.addEventListener(ev, off));
    const tick = ts => {
      if (held) acc += (ts - last) / 1000; last = ts;
      bar.style.width = `${Math.min(100, acc / holdS * 100)}%`;
      const should = Math.min(n, Math.floor(acc / holdS * n + 1e-6));
      while (out < should) candles[out++].classList.add('out');
      if (out >= n) { hint.textContent = '許個願 ✨'; hint.classList.add('go'); return setTimeout(res, 900); }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(ts => { last = ts; tick(ts); });
  });
  // 2. 煙火＋彩帶，打出大字
  cake.classList.add('away'); $('.bday-hold', ov).style.opacity = 0; hint.style.opacity = 0;
  const title = document.createElement('h1'); title.className = 'bday-title'; title.textContent = fillTpl(b.title); ov.appendChild(title);
  fx.confetti(true);
  const launch = () => fx.rocket(innerWidth * (.15 + Math.random() * .7));
  for (let i = 0; i < 9; i++) setTimeout(launch, i * 380 + Math.random() * 120);
  setTimeout(() => title.classList.add('show'), 700);
  const sparkler = setInterval(launch, 1500);   // 之後零星繼續放
  await wait(4200);
  // 3. 小動物們一起把禮物盒搬進來
  title.classList.add('top');
  const crew = treeCfg().animals.slice(0, 6);
  stage.innerHTML = `<p class="bday-hint parade-hint"></p>
    <div class="parade"><div class="carriers">${crew.slice(0, 3).map(a => animalHtml(a)).join('')}</div><div class="gift"><div class="gbox"></div><div class="lid"></div><div class="bow">🎀</div></div><div class="carriers">${crew.slice(3).map(a => animalHtml(a)).join('')}</div></div>
    <div class="bday-gain">+<span>0</span> ${PE}</div>
    <div class="bday-coupon"><div class="ce">${esc(b.giftEmoji || '🎂')}</div><h3>${esc(b.gift)}</h3><p>${esc(b.giftDesc || '')}</p><p>已經放進你的兌換券了</p><button class="btn">收下 💝</button></div>`;
  const parade = $('.parade', ov), phint = $('.parade-hint', ov), gift = $('.gift', ov);
  requestAnimationFrame(() => requestAnimationFrame(() => parade.classList.add('in')));
  await wait(2700);
  parade.classList.add('arrived', 'ready'); phint.textContent = '小動物們一起搬來的禮物 🎁 點一下盒蓋打開'; phint.style.opacity = 1;
  await new Promise(res => gift.addEventListener('pointerdown', res, { once: true }));
  // 4. 打開：星星從盒子裡噴出來，寫入星星和兌換券，通知男友
  parade.classList.remove('ready'); parade.classList.add('open'); phint.style.opacity = 0;
  const g = gift.getBoundingClientRect(), gx = g.left + g.width / 2, gy = g.top + 30;
  fx.stars(gx, gy, 45); fx.burst(gx, gy, '#ffd98a', 50);
  setTimeout(() => fx.stars(gx, gy, 25), 450); setTimeout(() => fx.stars(gx, gy, 15), 900);
  if (!preview) {
    if (!S.bday) S.bday = {};
    S.bday[bdayYear()] = { t: Date.now(), done: true };
    S.coupons.unshift({ id: uid(), name: b.gift, emoji: b.giftEmoji || '🎂', source: '生日', t: Date.now(), used: false });
    log('🎂', `生日禮物：「${b.gift}」`);
    if (+b.stars > 0) addPoints(+b.stars, '🎂', `生日禮物 +${+b.stars} 顆${PN}`); else save();
    notify({ title: `🎂 ${C.herName} 打開生日驚喜了`, message: `蠟燭吹熄、禮物拆開，收到 ${+b.stars || 0} 顆${PN}和「${b.gift}」\n${fmtTime(Date.now())}`, tags: ['birthday'], priority: 4 });
  }
  const gain = $('.bday-gain', ov), gnum = $('span', gain), total = +b.stars || 0; gain.classList.add('show');
  await new Promise(res => { let t0 = 0; const step = now => { if (!t0) t0 = now; const k = Math.min(1, (now - t0) / 1400); gnum.textContent = Math.round(total * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
  await wait(500);
  const cp = $('.bday-coupon', ov); cp.classList.add('show');
  await new Promise(res => { $('.btn', cp).onclick = res; });
  clearInterval(sparkler); fx.confetti(false);
  ov.style.transition = 'opacity .6s'; ov.style.opacity = 0;
  await wait(650); fx.stop(); ov.remove(); bdayActive = false;
  if (preview) toast('預演結束，沒有真的送星星和兌換券');
  else if (render[current] && !game.key) render[current]();
}

/* ================= 管理模式（連點月亮 5 下） ================= */
let moonTaps = 0, moonTimer;
function moonTap(e) {
  const m = e.currentTarget; m.classList.remove('wiggle'); void m.offsetWidth; m.classList.add('wiggle');
  moonTaps++; clearTimeout(moonTimer); moonTimer = setTimeout(() => { moonTaps = 0; }, 1500);
  if (moonTaps >= 5) { moonTaps = 0; admin(); }
}
async function admin() {
  const a = await modal({ icon: '🔐', title: '管理模式', html: '<input class="input" name="code" type="password" inputmode="numeric" autocomplete="off" placeholder="輸入密碼">', buttons: [{ text: '取消' }, { text: '進入', primary: true }] });
  if (a.i !== 1) return;
  if (String(a.values.code) !== String(C.adminCode)) return toast('密碼不對喔');
  const b = await modal({
    title: '🛠 管理模式',
    html: `<p class="left muted small">ntfy：${hasTopic() ? `已設定（${esc(C.ntfy.topic)}）` : '⚠️ 還沒設定 topic，收不到通知'}<br>等待送出的通知：${S.outbox.length} 則<br>回信後台：${hasBackend() ? `已設定（${esc(backendCfg().url)}）` : '未設定（看 backend/README.md）'}<br>主畫面推播：${esc(pushStatus())}</p>
           <input class="input" name="pts" type="number" inputmode="numeric" placeholder="加幾顆${PN}？（負數是扣）">`,
    buttons: [{ text: `加 / 扣${PN}`, primary: true }, { text: '重置今天的次數' }, { text: '測試通知' }, { text: '召喚偷星怪客' }, { text: '回信給樹洞 📨' }, { text: '預演生日 🎂' }, { text: '清除全部資料', danger: true }, { text: '關閉' }]
  });
  if (b.i === 0) {
    const n = parseInt(b.values.pts, 10);
    if (n) { addPoints(n, '🎁', n > 0 ? `${C.fromName} 送你 ${n} 顆${PN}` : `調整 ${n} 顆${PN}`); toast('完成'); }
  } else if (b.i === 1) {
    const d = dayKey();
    if (S.spins[d]) { S.spins[d + '#' + Date.now()] = S.spins[d]; delete S.spins[d]; }
    delete S.plays[d];
    S.wishes.forEach(w => { if (w.day === d) w.day = d + '#reset'; });
    if (S.thief) delete S.thief[d];
    if (S.streak && S.streak.last === d) { S.streak.last = yesterdayKey(); S.streak.count = Math.max(0, S.streak.count - 1); }
    save(); toast('今天的輪盤、遊戲、許願瓶、怪客、簽到都重置了');
  } else if (b.i === 2) {
    const r = await sendNtfy({ title: '🔔 測試通知', message: '看到這則就代表許願瓶通知設定成功了！', tags: ['white_check_mark'] });
    toast(r === 'ok' ? '已送出，看看 ntfy 有沒有收到' : r === 'skip' ? '還沒在 config.js 填 ntfy topic' : '送出失敗，檢查網路或 topic');
  } else if (b.i === 3) {
    const pool = thiefPool();
    if (!pool.length) return toast('還沒有題目，怪客出不來');
    return thiefAttack(pool[Math.floor(Math.random() * pool.length)]);
  } else if (b.i === 4) {
    return adminReply();
  } else if (b.i === 5) {
    return runBirthday({ preview: true });
  } else if (b.i === 6) {
    const c = await modal({ icon: '⚠️', title: '確定清除全部資料？', html: `<p>${PN}、兌換券、許願紀錄都會歸零，沒辦法復原。</p>`, buttons: [{ text: '取消' }, { text: '清除', danger: true }] });
    if (c.i === 1) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} location.reload(); return; }
  }
  if (render[current]) render[current]();
}

/* ================= 啟動 ================= */
document.title = C.appTitle || document.title;
{ const t = treeCfg(), tab = $('#tabTree'); if (tab) { if (t.enabled === false) tab.remove(); else tab.lastChild.textContent = t.tabName || '樹洞'; } }
$('#brand').innerHTML = `<span>✦</span> ${esc(C.appTitle || '星星小宇宙')}`;
$('#ptsEmoji').textContent = PE;
renderPoints();
initSky(); sizeFx(); requestAnimationFrame(skyLoop);

let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { initSky(); sizeFx(); if (wheelBuilt) drawWheel(); }, 200); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (wheelBuilt) drawWheel(); });
document.addEventListener('gesturestart', e => e.preventDefault());

let lastDay = dayKey();
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) return;
  flushOutbox(); syncPush();
  if (dayKey() !== lastDay) { lastDay = dayKey(); if (!game.key && render[current]) render[current](); }
  if (birthdayDays() === 0) maxStat('birthday', 1);
  if (bdayPending() && !game.key && !$('.modal-bg:not(.out)')) { await runBirthday(); await checkin(); await syncBackend(); await deliverReplies(); return; }   // 跨過午夜進入生日
  if (await checkin()) return;   // 剛簽到就先不叫怪客出來
  await syncBackend();
  if (await deliverReplies()) return;
  maybeThief();
});
addEventListener('online', () => { flushOutbox(); syncBackend().then(n => { if (n) deliverReplies(); }); });

go('home');
flushOutbox();

(async () => {
  registerSw();   // 推播用的 Service Worker（不做快取）
  const firstOpen = !S.welcomed;
  if (firstOpen) {
    S.welcomed = true;
    if (C.startingPoints) log('🎁', `見面禮 ${C.startingPoints} 顆${PN}`, C.startingPoints);
    save(); render.home();
    sparkle();
    await modal({ icon: '✨', title: `嗨 ${esc(C.herName)}，歡迎來到<br>${esc(C.appTitle || '星星小宇宙')}`, html: `<p>${nl2br(fillTpl(C.welcomeMessage))}</p>${C.startingPoints ? `<p class="gold">送你 ${PE} ${C.startingPoints} 顆${PN}當見面禮</p>` : ''}`, buttons: [{ text: '開始探索 🌙', primary: true }] });
  } else if (birthdayDays() === 0) {
    setTimeout(() => sparkle(innerWidth / 2, innerHeight * .3, 120), 500);
  }
  if (birthdayDays() === 0) maxStat('birthday', 1);
  const partied = bdayPending() ? (await runBirthday(), true) : false;   // 生日當天第一次打開：先演生日驚喜
  const signed = await checkin();
  await syncBackend();
  const delivered = await deliverReplies();
  const askedPush = !partied && await maybeAskPush();   // 問她要不要開主畫面通知（一次，之後隔幾天才再問）；放在成就前，成就彈窗會排在後面
  checkBadges();
  if (!firstOpen && !signed && !delivered && !partied && !askedPush) setTimeout(maybeThief, 900);   // 第一次打開、剛簽到或剛過完生日就不叫怪客
})();
})();
</script>
