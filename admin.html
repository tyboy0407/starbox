<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070720">
<title>樹洞回信後台</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg0:#070720;--card:rgba(255,255,255,.065);--line:rgba(255,255,255,.13);--text:#f4effe;--muted:#b9afdb;--gold:#ffd98a;--pink:#ff9ecf;--violet:#b48cff;--ok:#7be0a8;--ng:#ff8aa6;
  --font:"LXGW WenKai TC","PingFang TC","Heiti TC",-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg0);color:var(--text);font-family:var(--font)}
body{background:radial-gradient(ellipse 120% 70% at 50% 110%,#3d2275 0%,#1d1450 40%,#0b0a2a 75%,#070720 100%) fixed;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
textarea,input{font:inherit}
h2,h3,h4,p{margin:0}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(40px + env(safe-area-inset-bottom))}
.brand{font-size:18px;font-weight:700;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand span{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h4{font-size:15px;margin-bottom:10px;color:var(--gold);letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center} .gold{color:var(--gold)} .ok{color:var(--ok)} .ng{color:var(--ng)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:15px;color:#1a1430;
  background:linear-gradient(135deg,#b48cff,#ff9ecf);box-shadow:0 6px 20px rgba(180,140,255,.35)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}
.input,textarea.ta{width:100%;border-radius:14px;padding:12px 14px;font-size:16px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);outline:none}
textarea.ta{min-height:120px;resize:none;line-height:1.6}
.input:focus,textarea.ta:focus{border-color:rgba(180,140,255,.7)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.hidden{display:none!important}
.leaf{display:block;width:100%;text-align:left;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-bottom:8px;line-height:1.55}
.leaf.on{border-color:var(--gold);background:rgba(255,217,138,.12)}
.leaf .l-head{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:3px}
.leaf .l-text{white-space:pre-wrap;word-break:break-word}
.leaf .rep{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(143,214,148,.1);border:1px solid rgba(143,214,148,.3);font-size:13px;white-space:pre-wrap;word-break:break-word}
.leaf .rep b{display:block;font-size:12px;margin-bottom:2px}
.animals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ani{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px 8px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.ani .e{font-size:26px;line-height:1.2}
.ani .e img{width:44px;height:44px;object-fit:contain;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ani.on{border-color:var(--gold);background:rgba(255,217,138,.14);color:var(--text)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(44,26,94,.95);border:1px solid var(--line);padding:11px 18px;border-radius:999px;font-size:14px;transition:.25s;white-space:nowrap;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:rgba(123,224,168,.4)} .pill.wait{color:var(--gold);border-color:rgba(255,217,138,.4)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:10px 0}
.gifts{display:flex;flex-wrap:wrap;gap:6px}
.gtab{padding:7px 12px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted)}
.gtab.on{border-color:var(--gold);background:rgba(255,217,138,.14);color:var(--text)}
.gform{margin-top:8px;display:flex;gap:8px;align-items:center}
.gform .input{flex:1;min-width:0}
.gform .input.sm{flex:0 0 72px;text-align:center}
select.input{appearance:none;-webkit-appearance:none}
.gchip{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:999px;font-size:12px;background:rgba(255,217,138,.12);border:1px solid rgba(255,217,138,.4);color:var(--gold)}
</style>
</head>
<body>
<div id="app">
  <div class="brand"><div><span>✦</span> 樹洞回信後台</div><button class="btn ghost sm" id="setupBtn">⚙️ 設定</button></div>

  <div class="card" id="setup">
    <h4>連線設定</h4>
    <p class="muted small">第一次用要填一次，之後會記在這支手機裡。</p>
    <label>Worker 網址（例如 https://starbox-mail.xxx.workers.dev）</label>
    <input class="input" id="url" inputmode="url" autocapitalize="off" placeholder="https://…workers.dev">
    <label>後台密碼（Cloudflare 裡設的 ADMIN_SECRET）</label>
    <input class="input" id="secret" type="password" autocomplete="current-password">
    <div class="row"><span class="muted small" id="setupMsg"></span><button class="btn" id="saveSetup">儲存並連線</button></div>
  </div>

  <div class="card hidden" id="compose">
    <h4>✍️ 寫信給她 <span class="muted small" id="target">主動送的信（不指定葉子）</span></h4>
    <div class="animals" id="animals"></div>
    <textarea class="ta" id="text" maxlength="2000" placeholder="寫給她的話…" style="margin-top:10px"></textarea>
    <label>順便帶個禮物（選填，她按「收下」時才會進帳）</label>
    <div class="gifts" id="gifts"></div>
    <div id="giftForm"></div>
    <div class="row"><span class="muted small" id="tc">0 / 2000</span><button class="btn" id="send">派出去 🐾</button></div>
  </div>

  <div class="card hidden" id="leavesCard">
    <h4>🍃 她的葉子 <button class="btn ghost sm" id="refresh">↻ 重新整理</button></h4>
    <p class="muted small" style="margin-bottom:10px">點一片葉子就會變成「回這一片」；再點一次取消。</p>
    <div id="leaves"></div>
  </div>

  <div class="card hidden" id="pendingCard">
    <h4>📮 還沒送達的信</h4>
    <div id="pending"></div>
  </div>

  <div class="card hidden" id="pushCard">
    <h4>🔔 她的手機推播 <button class="btn ghost sm" id="pushTest">送一則測試</button></h4>
    <p class="muted small" id="pushInfo">—</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
(() => {
const C = window.APP_CONFIG || {};
const T = Object.assign({ moods: [], animals: [] }, C.tree || {});
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const fmt = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const moodOf = k => T.moods.find(m => m.key === k) || { emoji: '🍃', label: '' };
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); };

const KEY = 'starbox_admin';
let cfg = {}; try { cfg = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
let state = { leaves: [], replies: [] }, pickedLeaf = null, pickedAnimal = 0;
const PN = C.pointName || '星星', PE = C.pointEmoji || '⭐', SHOP = Array.isArray(C.shop) ? C.shop : [];
let gift = { type: 'none', n: 100, name: '', emoji: '🎁', shop: SHOP[0] ? SHOP[0].id : '' };
const GIFT_TABS = [['none', '不帶'], ['points', `${PE} ${PN}`], ['coupon', '🎟️ 自訂兌換券'], ['shop', '🎁 商店品項']];
// 把後台存的 gift 轉成一句話（待送達清單、葉子下方會顯示）
function giftLabel(g) {
  if (!g) return '';
  if (g.type === 'points') return `${PE} ${g.n} 顆${PN}`;
  if (g.type === 'shop') { const it = SHOP.find(x => x.id === g.id); return `${(it && it.emoji) || g.emoji || '🎁'} ${(it && it.name) || g.name || g.id}`; }
  return `${g.emoji || '🎁'} ${g.name || ''}`;
}
function giftPayload() {
  if (gift.type === 'points') return { type: 'points', n: Math.round(+gift.n) };
  if (gift.type === 'coupon') return gift.name.trim() ? { type: 'coupon', name: gift.name.trim(), emoji: gift.emoji.trim() || '🎁' } : null;
  if (gift.type === 'shop') { const it = SHOP.find(x => x.id === gift.shop); return it ? { type: 'shop', id: it.id, name: it.name, emoji: it.emoji || '🎁' } : null; }
  return null;
}
function renderGift() {
  $('#gifts').innerHTML = GIFT_TABS.map(([k, t]) => `<button class="gtab ${gift.type === k ? 'on' : ''}" data-g="${k}">${t}</button>`).join('');
  document.querySelectorAll('.gtab').forEach(b => b.onclick = () => { gift.type = b.dataset.g; renderGift(); });
  const f = $('#giftForm');
  if (gift.type === 'points') f.innerHTML = `<div class="gform"><input class="input" id="gN" type="number" inputmode="numeric" min="1" max="9999" value="${esc(gift.n)}"><span class="muted small">顆${esc(PN)}</span></div>`;
  else if (gift.type === 'coupon') f.innerHTML = `<div class="gform"><input class="input sm" id="gE" maxlength="4" placeholder="🎁" value="${esc(gift.emoji)}"><input class="input" id="gName" maxlength="40" placeholder="券的名字，例如：宵夜外送一次" value="${esc(gift.name)}"></div>`;
  else if (gift.type === 'shop') f.innerHTML = SHOP.length ? `<div class="gform"><select class="input" id="gShop">${SHOP.map(it => `<option value="${esc(it.id)}" ${it.id === gift.shop ? 'selected' : ''}>${esc(it.emoji || '🎁')} ${esc(it.name)}${it.dice ? '（會擲骰子）' : it.scratch ? '（會刮刮卡）' : ''}</option>`).join('')}</select></div><p class="muted small" style="margin-top:6px">不扣她的${esc(PN)}，直接送一張該品項的兌換券</p>` : '<p class="muted small" style="margin-top:6px">config.js 的 shop 是空的</p>';
  else f.innerHTML = '';
  const gN = $('#gN'), gE = $('#gE'), gName = $('#gName'), gShop = $('#gShop');
  if (gN) gN.oninput = () => { gift.n = gN.value; };
  if (gE) gE.oninput = () => { gift.emoji = gE.value; };
  if (gName) gName.oninput = () => { gift.name = gName.value; };
  if (gShop) gShop.onchange = () => { gift.shop = gShop.value; };
}

async function api(path, opts = {}) {
  const base = String(cfg.url || '').replace(/\/+$/, '');
  if (!base) throw new Error('還沒設定 Worker 網址');
  const res = await fetch(base + path, Object.assign({ headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (cfg.secret || '') } }, opts));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}
function showSetup(show) {
  $('#setup').classList.toggle('hidden', !show);
  ['#compose', '#leavesCard', '#pendingCard', '#pushCard'].forEach(s => $(s).classList.toggle('hidden', show));
}
async function refresh() {
  try {
    state = await api('/admin/state');
    render(); showSetup(false);
  } catch (e) { toast('連線失敗：' + e.message); showSetup(true); $('#setupMsg').textContent = e.message; }
}
function render() {
  const leaves = state.leaves || [], replies = state.replies || [];
  const repliesOf = id => replies.filter(r => r.leafId === id);
  $('#leaves').innerHTML = leaves.length ? leaves.map(l => { const m = moodOf(l.mood); return `<button class="leaf ${pickedLeaf === l.id ? 'on' : ''}" data-id="${esc(l.id)}">
      <div class="l-head"><span>${esc(m.emoji)} ${esc(m.label)} · ${fmt(l.t)}</span><span>${repliesOf(l.id).length ? '✓ 回過 ' + repliesOf(l.id).length + ' 封' : ''}</span></div>
      <div class="l-text">${esc(l.text)}</div>
      ${repliesOf(l.id).map(r => `<div class="rep"><b>${esc(r.animal.emoji)} ${esc(r.animal.name)} · ${fmt(r.t)} <span class="pill ${r.delivered ? 'ok' : 'wait'}">${r.delivered ? '已送達 ' + fmt(r.deliveredAt) : '待送達'}</span></b>${esc(r.text)}${r.gift ? `<div class="gchip">帶著 ${esc(giftLabel(r.gift))}</div>` : ''}</div>`).join('')}
    </button>`; }).join('') : '<div class="empty">她還沒放過葉子（或 App 還沒同步）</div>';
  document.querySelectorAll('.leaf').forEach(b => b.onclick = () => { pickedLeaf = pickedLeaf === b.dataset.id ? null : b.dataset.id; render(); if (pickedLeaf) $('#compose').scrollIntoView({ behavior: 'smooth' }); });
  const target = leaves.find(l => l.id === pickedLeaf);
  $('#target').textContent = target ? `回「${target.text.slice(0, 14)}${target.text.length > 14 ? '…' : ''}」` : '主動送的信（不指定葉子）';
  $('#animals').innerHTML = T.animals.map((a, i) => `<button class="ani ${i === pickedAnimal ? 'on' : ''}" data-i="${i}"><div class="e">${a.image ? `<img src="${esc(a.image)}" alt="${esc(a.emoji)}" data-e="${esc(a.emoji)}" onerror="this.outerHTML=this.dataset.e">` : esc(a.emoji)}</div>${esc(a.name || '')}</button>`).join('');
  document.querySelectorAll('.ani').forEach(b => b.onclick = () => { pickedAnimal = +b.dataset.i; render(); });
  const push = state.push || {};
  $('#pushInfo').textContent = !push.ready ? 'Cloudflare 還沒設 VAPID 金鑰（看 backend/README.md），派信時不會推播'
    : push.subs ? `她的手機已訂閱（${push.subs} 支，最近 ${fmt(push.last)}）。你派小動物時會跳通知；訂閱失效會自動清掉。` : '她還沒在主畫面 App 裡同意通知。她打開 App 時會被問一次；同意後這裡會顯示已訂閱。';
  $('#pushTest').disabled = !push.ready || !push.subs;
  const pending = replies.filter(r => !r.delivered);
  $('#pending').innerHTML = pending.length ? pending.map(r => `<div class="leaf"><div class="l-head"><span>${esc(r.animal.emoji)} ${esc(r.animal.name)} · ${fmt(r.t)}${r.leafId ? '' : ' · 主動送的'}</span><button class="btn ghost sm" data-del="${esc(r.id)}">收回</button></div><div class="l-text">${esc(r.text)}</div>${r.gift ? `<div class="gchip">帶著 ${esc(giftLabel(r.gift))}</div>` : ''}</div>`).join('') : '<div class="empty">沒有待送達的信，她都收到了 💌</div>';
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (!confirm('收回這封還沒送達的信？')) return; try { await api('/admin/reply/delete', { method: 'POST', body: JSON.stringify({ id: b.dataset.del }) }); toast('已收回'); refresh(); } catch (e) { toast(e.message); } });
}
$('#url').value = cfg.url || ''; $('#secret').value = cfg.secret || '';
$('#setupBtn').onclick = () => showSetup($('#setup').classList.contains('hidden'));
$('#saveSetup').onclick = () => { cfg = { url: $('#url').value.trim(), secret: $('#secret').value }; try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} $('#setupMsg').textContent = '連線中…'; refresh(); };
$('#refresh').onclick = refresh;
$('#pushTest').onclick = async () => {
  $('#pushTest').disabled = true;
  try { const r = await api('/admin/push/test', { method: 'POST', body: JSON.stringify({ title: '星星小宇宙', body: '這是寶球發的測試通知 🔔 收到的話就代表成功了' }) }); toast(r.sent ? `已推給 ${r.sent} 支手機` : '推播服務沒收下，稍後再試'); }
  catch (e) { toast('失敗：' + e.message); }
  $('#pushTest').disabled = false;
};
$('#text').oninput = () => { $('#tc').textContent = `${$('#text').value.length} / 2000`; };
renderGift();
$('#send').onclick = async () => {
  const text = $('#text').value.trim(), g = giftPayload();
  if (gift.type !== 'none' && !g) return toast(gift.type === 'coupon' ? '先幫兌換券取個名字' : '禮物還沒選好');
  if (g && g.type === 'points' && !(g.n >= 1 && g.n <= 9999)) return toast(`${PN}要填 1～9999`);
  if (!text && !g) return toast('先寫點什麼吧');
  const a = T.animals[pickedAnimal] || { emoji: '🐿️', name: '松鼠' };
  $('#send').disabled = true;
  try {
    await api('/admin/reply', { method: 'POST', body: JSON.stringify({ leafId: pickedLeaf || '', animal: { emoji: a.emoji, name: a.name || '' }, text, gift: g || undefined }) });
    $('#text').value = ''; $('#tc').textContent = '0 / 2000'; pickedLeaf = null;
    gift.type = 'none'; gift.name = ''; renderGift();
    toast(g ? `${a.emoji} 帶著 ${giftLabel(g)} 出發了` : `${a.emoji} 已經出發，她下次打開 App 就會收到`);
    await refresh();
  } catch (e) { toast('送出失敗：' + e.message); }
  $('#send').disabled = false;
};
if (cfg.url && cfg.secret) refresh(); else showSetup(true);
document.addEventListener('visibilitychange', () => { if (!document.hidden && cfg.url) refresh(); });
})();
</script>
</body>
</html>
